          recordHistory("移動節點", `node:move:${movedNode.id}`, dragHistorySnapshotRef.current);
          dragHistorySnapshotRef.current = null;
        }
      };

      const onNodeDrag = (_event, movedNode) => {
        setNodes((items) => {
          const visible = getVisibleLanes(items);
          return items.map((item) => item.id === movedNode.id
            ? clampNodeToLane({ ...item, position: { ...item.position, y: movedNode.position.y } }, visible)
            : item);
        });
      };

      const addFlow = () => {
        recordHistory("新增泳道圖", "flow:add");
        const id = `flow-${flows.length + 1}`;
        const next = {
          id,
          name: `新流程圖 ${flows.length + 1}`,
          version: "非正式",
          doc: normalizeFlowDoc({ id, name: `新流程圖 ${flows.length + 1}`, version: "非正式" }),
          nodes: [
            node("S1", "申請人", "start", 54, 120, "流程起點", "請填寫此流程的起點。", "待補"),
            node("S2", "表單介面", "end", 454, 120, "流程結束", "請填寫此流程的結束條件。", "待補"),
            noteNode("R1", 120, "流程備註", "可在此補充本流程的例外、待確認或閱讀提示。")
          ],
          edges: [edge("S1", "S2", "完成")]
        };
        setFlows((items) => items.concat(next));
        setActiveFlowId(id);
      };

      const duplicateFlow = () => {
        const source = flows.find((item) => item.id === activeFlowId);
        if (!source) return;
        recordHistory("複製泳道圖", "flow:duplicate");
        const id = `flow-${flows.length + 1}`;
        const copy = JSON.parse(JSON.stringify(source));
        copy.id = id;
        copy.name = `${source.name} 複本`;
        copy.doc = normalizeFlowDoc(copy);
        setFlows((items) => items.concat(copy));
        setActiveFlowId(id);
      };

      const deleteFlow = () => {
        if (flows.length <= 1) return;
        recordHistory("刪除泳道圖", `flow:delete:${activeFlowId}`);
        const next = flows.filter((item) => item.id !== activeFlowId);
        setFlows(next);
        setActiveFlowId(next[0].id);
      };

      const getJsonFilename = () => `${(activeFlowDoc.featureName || doc.featureName || "tool-swimlane-diagram").replace(/[\\/:*?"<>|]+/g, "-")}.data.json`;

      const applyPersistentState = (fileState, handle) => {
        const fileFlow = fileState.flows.find((flow) => flow.id === fileState.activeFlowId) || fileState.flows[0];
        skipNextDirtyRef.current = true;
        setDoc(fileState.doc);
        setFlows(fileState.flows);
        setActiveFlowId(fileState.activeFlowId);
        setNodes(fileFlow.nodes);
        setEdges(fileFlow.edges);
        setSelectedNodeId(fileFlow.nodes[0]?.id || "");
        setSelectedEdgeId("");
        setFontSizeMode(fileState.fontSizeMode);
        setHistoryState({ undo: [], redo: [], log: [] });
        latestSaveRef.current = fileState;
        dirtySaveRef.current = true;
        persistentHandleRef.current = handle;
        persistentReadyRef.current = true;
        setLastJsonSavedAt(fileState.savedAt || "");
        setPersistentStatus(`JSON 檔案 已連接：${handle.name}`);
        setSaveStatus(`已載入JSON 檔案：${handle.name}，15 秒內同步`);
      };

      const jsonFilePickerTypes = [
        {
          description: "泳道圖 JSON",
          accept: { "application/json": [".json"] }
        }
      ];

      const openPersistentJson = async () => {
        if (!("showOpenFilePicker" in window)) {
          setPersistentStatus("此瀏覽器不支援開啟JSON 檔案");
          setSaveStatus("請改用 Chrome/Edge 或手動匯入流程");
          return;
        }
        try {
          const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: jsonFilePickerTypes
          });
          const allowed = await hasFileWritePermission(handle, true);
          if (!allowed) {
            setPersistentStatus(`JSON 檔案 未授權：${handle.name}`);
            setSaveStatus("未取得檔案寫入權限");
            return;
          }
          const fileState = await readPersistentState(handle);
          if (!fileState) {
            setSaveStatus("JSON 格式不符合此泳道圖工具");
            return;
          }
          await storePersistentHandle(handle);
          applyPersistentState(fileState, handle);
        } catch (error) {
          if (error?.name === "AbortError") {
            setSaveStatus("已取消開啟JSON 檔案");
          } else {
            setPersistentStatus("JSON 檔案 載入失敗");
            setSaveStatus("JSON 檔案 載入失敗");
          }
        }
      };

      const connectPersistentJson = async () => {
        try {
          await setupAutoPersistentJson("自動儲存 JSON");
        } catch (error) {
          setPersistentStatus("自動儲存 JSON 建立失敗");
          setSaveStatus("自動儲存 JSON 建立失敗，請先匯出 JSON 備份");
        }
      };

      const saveNow = async () => {
        const handle = persistentHandleRef.current;
        if (!handle) {
          await setupAutoPersistentJson("自動儲存 JSON");
          return;
        }
        const allowed = await hasFileWritePermission(handle, true).catch(() => false);
        persistentReadyRef.current = allowed;
        if (!allowed) {
          setPersistentStatus(`JSON 檔案 未授權：${handle.name}`);
          setSaveStatus("未取得檔案寫入權限");
          return;
        }
        dirtySaveRef.current = true;
        await flushAutosave(true, true);
      };

      const toggleAutoSave = async () => {
        const nextEnabled = !autoSaveEnabled;
        setAutoSaveEnabled(nextEnabled);
        rememberAutoSaveEnabled(nextEnabled);
        if (!nextEnabled) {
          window.localStorage.removeItem(STORAGE_KEY);
          setPersistentStatus(`自動儲存 JSON 已暫停：${LOCAL_AUTOSAVE_FILE_NAME}`);
          setSaveStatus("自動存檔已關閉，JSON 與 UI 暫存都不會自動寫入");
          return;
        }
        dirtySaveRef.current = true;
        setPersistentStatus(`自動儲存 JSON 已啟用：${LOCAL_AUTOSAVE_FILE_NAME}`);
        setSaveStatus("自動存檔已開啟，15 秒內同步 JSON 與 UI 暫存");
      };

      const disconnectPersistentJson = async () => {
        persistentHandleRef.current = null;
        persistentReadyRef.current = false;
        await clearPersistentHandle().catch(() => false);
        setPersistentStatus("本次已停止自動儲存 JSON");
        setSaveStatus("已停止本次自動儲存 JSON；重新整理後會再自動建立");
      };

      const exportJson = () => {
        download(getJsonFilename(), JSON.stringify(makeSavePayload(doc, flows, activeFlowId, fontSizeMode), null, 2), "application/json");
      };

      const exportMarkdown = () => {
        download(`${activeFlowDoc.featureName || doc.featureName || "tool-swimlane-diagram"}.output.md`, makeMarkdown(doc, flows), "text/markdown");
      };

      const openJsonLocation = async () => {
        setSaveStatus(`JSON 位置：${LOCAL_AUTOSAVE_FILE_NAME}`);
      };

      const clearAutosave = () => {
        window.localStorage.removeItem(STORAGE_KEY);
        dirtySaveRef.current = false;
        setSaveStatus("已清除暫存，重新整理後回到範例");
      };

      const renderStickyLaneBar = () => {
        let laneIndex = 0;
        const stickyColumns = displayLanes.map((laneName) => `${laneName === noteLaneName ? noteLaneWidth : laneWidth}px`).join(" ");
        return h("div", { className: "sticky-lane-bar-wrap" },
          h("div", {
            className: "sticky-lane-bar",
            style: {
              width: laneBoardWidth,
              gridTemplateColumns: stickyColumns,
              transform: `translateX(${Math.round(flowViewport.x)}px) scale(${flowViewport.zoom})`
            }
          },
            displayLaneGroups.flatMap((group) => group.lanes.map((laneName) => {
              const cell = h("div", { key: `${group.group}-${laneName}-${laneIndex}`, className: "sticky-lane-cell" },
                h("small", null, group.group),
                h("strong", null, laneName)
              );
              laneIndex += 1;
              return cell;
            }))
          )
        );
      };

      const tabScrollHandlers = {
        onWheel: (event) => {
          const delta = Math.abs(event.deltaY) >= Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
          if (!delta) return;
          event.currentTarget.scrollLeft += delta;
          event.preventDefault();
        },
        onPointerDown: (event) => {
          if (event.button !== 0) return;
          if (event.target.closest?.("button")) return;
          tabDragRef.current = {
            active: true,
            moved: false,
            startX: event.clientX,
            scrollLeft: event.currentTarget.scrollLeft
          };
          event.currentTarget.classList.add("dragging");
          event.currentTarget.setPointerCapture?.(event.pointerId);
        },
        onPointerMove: (event) => {
          const state = tabDragRef.current;
          if (!state.active) return;
          const dx = event.clientX - state.startX;
          if (Math.abs(dx) > 4) state.moved = true;
          event.currentTarget.scrollLeft = state.scrollLeft - dx;
        },
        onPointerUp: (event) => {
          const didMove = tabDragRef.current.moved;
          tabDragRef.current.active = false;
          event.currentTarget.classList.remove("dragging");
          event.currentTarget.releasePointerCapture?.(event.pointerId);
          if (didMove) {
            window.setTimeout(() => {
              tabDragRef.current.moved = false;
            }, 0);
          }
        },
        onPointerCancel: (event) => {
          tabDragRef.current.active = false;
          tabDragRef.current.moved = false;
          event.currentTarget.classList.remove("dragging");
        },
        onPointerLeave: (event) => {
          if (!tabDragRef.current.active) return;
          tabDragRef.current.active = false;
          tabDragRef.current.moved = false;
          event.currentTarget.classList.remove("dragging");
        }
      };

      const renderFlowCanvas = (readonly = false) => {
        const defaultFlowViewport = readonly ? { x: 24, y: 28, zoom: 0.9 } : { x: 32, y: 28, zoom: 0.82 };
        return h("div", { className: `flow-canvas ${readonly ? "presentation-canvas" : ""}`, style: { height: flowViewportHeight, minHeight: flowViewportHeight } },
        readonly ? renderStickyLaneBar() : null,
        h(ReactFlow, {
          key: `${activeFlowId}-${readonly ? "present" : "edit"}`,
          style: { height: "100%" },
          nodes: displayNodes,
          edges: displayEdges,
          nodeTypes,
          edgeTypes,
          onNodesChange: handleNodesChange,
          onEdgesChange,
          onConnect,
          onReconnect,
          onReconnectEnd: readonly ? undefined : onReconnectEnd,
          isValidConnection: (connection) => canUseConnection(connection, edges),
          connectionMode: ConnectionMode.Loose,
          onMove: (_event, viewport) => setFlowViewport(viewport),
          onPaneClick: () => {
            setSelectedNodeId("");
            setSelectedEdgeId("");
            setConnectSourceId("");
            setConnectTargetId("");
            setEditDialog(null);
          },
          onNodeClick: (_event, clickedNode) => {
            if (String(clickedNode.id).startsWith("lane-")) return;
            const clickedIsNote = isNoteNode(clickedNode);
            if (!readonly && !clickedIsNote && connectSourceId && connectSourceId !== clickedNode.id) {
              connectNodes(connectSourceId, clickedNode.id);
              setConnectSourceId("");
            }
            if (!readonly && !clickedIsNote && connectTargetId && connectTargetId !== clickedNode.id) {
              connectNodes(clickedNode.id, connectTargetId);
              setConnectTargetId("");
            }
            setSelectedNodeId(clickedNode.id);
            setSelectedEdgeId("");
          },
          onEdgeClick: (_event, clickedEdge) => { setSelectedEdgeId(clickedEdge.id); setSelectedNodeId(""); },
          onNodeDoubleClick: (_event, clickedNode) => {
            if (readonly || String(clickedNode.id).startsWith("lane-")) return;
            setSelectedNodeId(clickedNode.id);
            setSelectedEdgeId("");
            setEditDialog("node");
          },
          onEdgeDoubleClick: (_event, clickedEdge) => {
            if (readonly) return;
            setSelectedEdgeId(clickedEdge.id);
            setSelectedNodeId("");
            setEditDialog("edge");
          },
          onNodeDragStart: readonly ? undefined : onNodeDragStart,
          onNodeDrag: readonly ? undefined : onNodeDrag,
          onNodeDragStop: readonly ? undefined : onNodeDragStop,
          fitView: false,
          defaultViewport: defaultFlowViewport,
          nodeOrigin: [0, 0],
          snapToGrid: true,
          snapGrid: [16, 16],
          nodesDraggable: !readonly,
          nodesConnectable: !readonly,
          edgesReconnectable: !readonly,
          deleteKeyCode: null,
          connectionRadius: 40,
          reconnectRadius: 36,
          defaultEdgeOptions: { type: "cleanStep", pathOptions: {}, interactionWidth: 32 },
          translateExtent: [[-laneBoardWidth, -flowWorldHeight], [laneBoardWidth * 2 + 800, flowWorldHeight + 1200]],
          minZoom: 0.5,
          maxZoom: 1.45,
          panOnDrag: true,
          zoomOnScroll: true
        },
          h(Controls, null)
        )
      );
      };

      const renderFlowTabs = () => h("div", { className: "tabs", ...tabScrollHandlers },
        flows.map((flow) => h("button", {
          key: flow.id,
          type: "button",
          className: `tab ${flow.id === activeFlowId ? "active" : ""}`,
          onClick: () => setActiveFlowId(flow.id)
        },
          flow.name,
          h("span", { className: `tab-version ${flow.version === "正式" ? "formal" : "draft"}` }, flow.version || "非正式")
        ))
      );

      const jsonSavedTimeText = formatJsonSavedTime(lastJsonSavedAt);
      const autosaveStatusText = autoSaveEnabled
        ? (dirtySaveRef.current ? `未儲存｜上次 ${jsonSavedTimeText}` : jsonSavedTimeText)
        : `自動存檔關閉｜上次 ${jsonSavedTimeText}`;

      const renderPresentationMain = () => h("main", { className: "presentation-app" },
        h("section", { className: "flow-area" },
          h("section", { className: "panel flow-shell" },
            renderFlowTabs(),
            renderFlowBrief(activeFlowDoc, activeFlow, visibleLaneGroups),
            renderFlowCanvas(true)
          )
        )
      );

      const renderEditDialog = () => {
        if (!editDialog) return null;
        const isEdgeDialog = editDialog === "edge";
        return h("div", {
          className: "modal-backdrop",
          onMouseDown: (event) => {
            if (event.target === event.currentTarget) setEditDialog(null);
          }
        },
          h("section", {
            className: "modal-panel",
            role: "dialog",
            "aria-modal": "true",
            "aria-label": isEdgeDialog ? "編輯線" : "編輯截點",
            onMouseDown: (event) => event.stopPropagation()
          },
            h("div", { className: "modal-head" },
              h("h2", null, isEdgeDialog ? "編輯線" : "編輯截點"),
              h("button", { type: "button", onClick: () => setEditDialog(null) }, "關閉")
            ),
            h("div", { className: "modal-body" },
              isEdgeDialog
                ? selectedEdge
                  ? renderEdgeEditor(selectedEdge, activeFlow.nodes, updateEdge, updateEdgeFields, deleteSelectedEdge)
                  : h("p", { className: "hint" }, "目前沒有選取線。")
                : renderSelectedNodeEditor(selectedNode, activeFlow.nodes, activeHiddenLanes, activeCustomLaneGroups, updateNodeData, deleteLane, addNodeToFlow, addNoteToFlow, deleteSelectedNode, connectSourceId, setConnectSourceId, connectTargetId, setConnectTargetId, connectNodes)
            )
          )
        );
      };

      return h("div", { className: `font-${fontSizeMode} ${viewMode === "present" ? "presentation-mode" : "edit-mode"}` },
        h("header", null,
          h("div", null,
            h("h1", null, "tool-swimlane-diagram"),
            h("p", null, "Developer: Jimmy C")
          ),
          h("div", { className: "toolbar" },
            h("div", { className: "mode-control", "aria-label": "顯示模式" },
              h("button", {
                type: "button",
                className: viewMode === "edit" ? "active" : "",
                onClick: () => setViewMode("edit")
              }, "編輯"),
              h("button", {
                type: "button",
                className: viewMode === "present" ? "active" : "",
                onClick: () => setViewMode("present")
              }, "演示")
            ),
            h("span", { className: "tag info" }, "React Flow"),
            h("span", {
              className: `tag ${autoSaveEnabled ? "ok" : "danger"}`,
              title: `${saveStatus} / ${persistentStatus} / ${LOCAL_AUTOSAVE_FILE_NAME} / ${jsonSavedTimeText}`
            }, autosaveStatusText),
            h("button", { type: "button", onClick: toggleAutoSave }, autoSaveEnabled ? "關閉自動存檔" : "開啟自動存檔"),
            h("button", { type: "button", onClick: openJsonLocation }, "開啟 JSON 位置"),
            h("button", { type: "button", onClick: exportMarkdown }, "匯出 MD")
          )
        ),
        viewMode === "present" ? renderPresentationMain() : h("main", { className: `app ${collapsed ? "collapsed" : ""}` },
          h("aside", { className: "side" },
            h("div", { className: "side-rail" }, h("button", { type: "button", onClick: () => setCollapsed(false) }, "展開設定")),
            h("div", { className: "side-content" },
              h("div", { className: "toolbar", style: { marginBottom: "12px" } },
                h("button", { type: "button", onClick: () => setCollapsed(true) }, "向左收合"),
                h("span", { className: "tag info" }, selectedEdge ? "正在編輯箭頭" : connectSourceId ? `箭頭起點：${connectSourceId}` : connectTargetId ? `箭頭終點：${connectTargetId}` : "點節點後編輯")
              ),
              renderFlowManagerPanel({ flows, activeFlow, moveFlow, selectFlow, flowSearchQuery, setFlowSearchQuery, historyState, undoHistory, redoHistory, addFlow, duplicateFlow, deleteFlow }),
              renderDocPanel(activeFlowDoc, updateFlowDoc, activeFlow, updateFlowVersion),
              renderNodePanel({ activeFlow, activeHiddenLanes, activeCustomLaneGroups, selectedNode, selectedEdge, updateFlowName, updateNodeData, deleteLane, updateEdge, updateEdgeFields, addNodeToFlow, addNoteToFlow, deleteSelectedNode, deleteSelectedEdge, connectSourceId, setConnectSourceId, connectTargetId, setConnectTargetId, connectNodes })
            )
          ),
          h("section", { className: "flow-area" },
            h("section", { className: "panel flow-shell" },
              renderFlowTabs(),
              h("div", { className: "flow-toolbar" },
                h("div", null,
                  h("strong", null, activeFlow.name),
                  h("span", { className: `tag ${activeFlow.version === "正式" ? "formal" : "draft"}`, style: { marginLeft: "8px" } }, activeFlow.version || "非正式"),
                  h("p", { className: "hint" }, "節點在泳道中自動水平置中，只能上下拖曳；拖曳或調整大小後，同泳道節點會自動避開重疊並保留間距。")
                ),
                h("div", { className: "toolbar" },
                  h("button", { type: "button", className: "primary", onClick: addNodeToFlow }, "新增截點")
                )
              ),
              renderFlowCanvas(false)
            ),
            h("section", { className: "panel" },
              h("div", { className: "panel-body" },
                h("div", { className: "output-head" },
                  h("h2", null, `輸出：01-業務流程.md（${documentVersion}）`),
                  h("button", { type: "button", onClick: () => copyText(makeMarkdown(doc, flows)) }, "複製 Markdown")
                ),
                h("pre", null, makeMarkdown(doc, flows))
              )
            )
          )
        ),
        renderEditDialog()
      );
    }

    function renderFlowManagerPanel(props) {
      const { flows, activeFlow, moveFlow, selectFlow, flowSearchQuery, setFlowSearchQuery, historyState, undoHistory, redoHistory, addFlow, duplicateFlow, deleteFlow } = props;
      return h("details", { className: "panel", open: true },
        h("summary", null, h("div", { className: "panel-head" }, h("h2", null, "泳道圖管理"), h("span", null, "▸"))),
        h("div", { className: "panel-body" },
          h("div", { className: "toolbar", style: { marginBottom: "12px" } },
            h("button", { type: "button", onClick: addFlow }, "新增泳道圖"),
            h("button", { type: "button", onClick: duplicateFlow }, "複製目前圖"),
            h("button", { type: "button", className: "danger", disabled: flows.length <= 1, onClick: deleteFlow }, "刪除目前圖")
          ),
          renderHistoryPanel(historyState, undoHistory, redoHistory),
          renderFlowOrderEditor(flows, activeFlow.id, moveFlow, selectFlow, flowSearchQuery, setFlowSearchQuery)
        )
      );
    }

    function renderHistoryPanel(historyState, undoHistory, redoHistory) {
      const logItems = historyState.log || [];
      return h("div", { className: "status-note", style: { marginBottom: "12px" } },
        h("strong", null, "復原 / 取消復原"),
        h("div", { className: "history-actions", style: { marginTop: "8px" } },
          h("button", { type: "button", disabled: !(historyState.undo || []).length, onClick: undoHistory, title: "復原 Ctrl+Z" }, "↶ 復原"),
          h("button", { type: "button", disabled: !(historyState.redo || []).length, onClick: redoHistory, title: "取消復原 Ctrl+Y" }, "↷ 取消復原")
        ),
        h("div", { className: "history-list", style: { marginTop: "8px" } },
          logItems.length
            ? logItems.map((item) => h("div", { key: item.id, className: "history-item", title: item.label },
                h("span", null, formatHistoryTime(item.at)),
                h("span", null, item.label)
              ))
            : h("p", { className: "hint", style: { margin: 0 } }, "尚無操作記錄")
        )
      );
    }

    function renderFlowOrderEditor(flows, activeFlowId, moveFlow, selectFlow, flowSearchQuery, setFlowSearchQuery) {
      const filteredFlows = flows
        .map((flow, index) => ({ flow, index }))
        .filter(({ flow }) => matchesFlowSearch(flow, flowSearchQuery));
      return h("div", { className: "status-note" },
        h("strong", null, "Tab 順序"),
        inputField("泳道圖搜尋", "flowSearch", flowSearchQuery, setFlowSearchQuery, false, "例：請假 主管 通知", "flow-search-field"),
        h("p", { className: "hint" }, "可模糊搜尋泳道圖主體資料、節點內容與線段文字；點選項目可載入該泳道圖。"),
        h("div", { className: "flow-order-list" },
          filteredFlows.length
            ? filteredFlows.map(({ flow, index }) => h("div", {
              key: flow.id,
              className: `flow-order-item ${flow.id === activeFlowId ? "active" : ""}`,
              role: "button",
              tabIndex: 0,
              onClick: () => selectFlow(flow.id),
              onKeyDown: (event) => {
                if (event.key === "Enter" || event.key === " ") {
                  event.preventDefault();
                  selectFlow(flow.id);
                }
              }
            },
            h("div", {
              className: "flow-order-name",
              title: flow.name
            },
              h("span", { className: "flow-order-title" }, flow.name),
              h("span", { className: `tab-version ${flow.version === "正式" ? "formal" : "draft"}` }, flow.version || "非正式"),
              flow.id === activeFlowId ? h("span", { className: "tab-version formal" }, "目前") : null
            ),
            h("div", { className: "toolbar" },
              h("button", { type: "button", className: "flow-order-move", disabled: index === 0, title: "置頂", onClick: (event) => { event.stopPropagation(); moveFlow(flow.id, "first"); } }, "⤒"),
              h("button", { type: "button", className: "flow-order-move", disabled: index === 0, title: "上移", onClick: (event) => { event.stopPropagation(); moveFlow(flow.id, "up"); } }, "↑"),
              h("button", { type: "button", className: "flow-order-move", disabled: index === flows.length - 1, title: "下移", onClick: (event) => { event.stopPropagation(); moveFlow(flow.id, "down"); } }, "↓"),
              h("button", { type: "button", className: "flow-order-move", disabled: index === flows.length - 1, title: "置底", onClick: (event) => { event.stopPropagation(); moveFlow(flow.id, "last"); } }, "⤓")
            )
          ))
          : h("div", { className: "flow-order-empty" }, "找不到符合的泳道圖")
        )
      );
    }

    function renderDocPanel(doc, updateDoc, activeFlow, updateFlowVersion) {
      return h("details", { className: "panel", open: true },
        h("summary", null, h("div", { className: "panel-head" }, h("h2", null, "目前泳道圖描述"), h("span", null, "▸"))),
        h("div", { className: "panel-body" },
          h("p", { className: "hint" }, "此區只描述上方目前選取的泳道圖；流程問題、待確認與補充說明請寫在右側備註節點。"),
          inputField("泳道圖標題", "featureName", doc.featureName, (value) => updateDoc("featureName", value)),
          selectField("目前泳道圖版本", activeFlow.version || "非正式", flowVersions, updateFlowVersion),
          textField("流程背景", doc.background, (value) => updateDoc("background", value)),
          textField("本圖包含", doc.includeScope, (value) => updateDoc("includeScope", value)),
          textField("本圖不包含", doc.excludeScope, (value) => updateDoc("excludeScope", value))
        )
      );
    }

    function renderNodePanel(props) {
      const { activeFlow, activeHiddenLanes, activeCustomLaneGroups, selectedNode, selectedEdge, updateFlowName, updateNodeData, deleteLane, updateEdge, updateEdgeFields, addNodeToFlow, addNoteToFlow, deleteSelectedNode, deleteSelectedEdge, connectSourceId, setConnectSourceId, connectTargetId, setConnectTargetId, connectNodes } = props;
      return h("details", { className: "panel", open: true },
        h("summary", null, h("div", { className: "panel-head" }, h("h2", null, "節點 / 箭頭編輯"), h("span", null, "▸"))),
        h("div", { className: "panel-body" },
          inputField("目前流程圖名稱", "flowName", activeFlow.name, updateFlowName),
          selectedEdge
            ? renderEdgeEditor(selectedEdge, activeFlow.nodes, updateEdge, updateEdgeFields, deleteSelectedEdge)
            : renderSelectedNodeEditor(selectedNode, activeFlow.nodes, activeHiddenLanes, activeCustomLaneGroups, updateNodeData, deleteLane, addNodeToFlow, addNoteToFlow, deleteSelectedNode, connectSourceId, setConnectSourceId, connectTargetId, setConnectTargetId, connectNodes)
        )
      );
    }

    function renderSelectedNodeEditor(selectedNode, flowNodes, hiddenLanes, customLaneGroups, updateNodeData, deleteLane, addNodeToFlow, addNoteToFlow, deleteSelectedNode, connectSourceId, setConnectSourceId, connectTargetId, setConnectTargetId, connectNodes) {
      if (!selectedNode) {
        return h(React.Fragment, null,
          h("p", { className: "hint" }, "目前沒有選取節點。"),
          h("div", { className: "toolbar" },
            h("button", { type: "button", onClick: addNodeToFlow }, "新增節點"),
            h("button", { type: "button", onClick: addNoteToFlow }, "新增備註")
          )
        );
      }
      if (isNoteNode(selectedNode)) {
        return h(React.Fragment, null,
          h("p", { className: "hint" }, `預設建議高度：${estimateNoteHeight(selectedNode.data)}px；高度可自行調整。`),
          inputField("備註代號", "noteId", selectedNode.id, () => {}, true),
          inputField("備註標題", "noteTitle", selectedNode.data.title, (value) => updateNodeData("title", value)),
          numberField("高度", selectedNode.data.height || defaultNoteHeight, minNoteHeight, canvasHeight - 120, (value) => updateNodeData("height", value)),
          textField("備註內容", selectedNode.data.desc, (value) => updateNodeData("desc", value)),
          h("p", { className: "hint" }, "備註固定在最右側備註欄，不參與起點、終點與箭頭連線。寬度自動套用備註欄最大寬度；可上下拖曳與調整高度。"),
          h("div", { className: "toolbar" },
            h("button", { type: "button", className: "primary", onClick: addNoteToFlow }, "新增備註"),
            h("button", { type: "button", onClick: addNodeToFlow }, "新增節點"),
            h("button", { type: "button", className: "danger", onClick: deleteSelectedNode }, "刪除備註")
          )
        );
      }
      return h(React.Fragment, null,
        (() => {
          const suggestedHeight = estimateNodeHeight(selectedNode.data);
          return h("p", { className: "hint" }, `預設建議高度：${suggestedHeight}px；高度可自行調整。`);
        })(),
        h("div", { className: "mini-grid" },
          inputField("節點代號", "nodeId", selectedNode.id, () => {}, true),
          selectField("節點型態", selectedNode.data.kind, ["start", "task", "decision", "form", "exception", "end"], (value) => updateNodeData("kind", value), kindLabel)
        ),
        inputField("節點名稱", "nodeTitle", selectedNode.data.title, (value) => updateNodeData("title", value)),
        h(LaneSelectField, {
          value: selectedNode.data.lane,
          flowNodes,
          hiddenLanes,
          customLaneGroups,
          onChange: (value) => updateNodeData("lane", value),
          onDelete: deleteLane
        }),
        h("div", { className: "mini-grid" },
          numberField("寬度", selectedNode.data.width || defaultNodeWidth, minNodeWidth, maxNodeWidth, (value) => updateNodeData("width", value)),
          numberField("高度", selectedNode.data.height || defaultNodeHeight, minNodeHeight, maxNodeHeight, (value) => updateNodeData("height", value))
        ),
        textField("節點說明", selectedNode.data.desc, (value) => updateNodeData("desc", value)),
        textField("流程限制", selectedNode.data.constraint, (value) => updateNodeData("constraint", value)),
        h("div", { className: "toolbar" },
          h("button", { type: "button", className: "primary", onClick: addNodeToFlow }, "新增節點"),
          h("button", { type: "button", onClick: addNoteToFlow }, "新增備註"),
          h("button", { type: "button", className: "danger", onClick: deleteSelectedNode }, "刪除節點")
        ),
        h("div", { className: "toolbar", style: { marginTop: "10px" } },
          !connectSourceId
            ? h("button", { type: "button", onClick: () => { setConnectSourceId(selectedNode.id); setConnectTargetId(""); } }, "設為箭頭起點")
            : connectSourceId === selectedNode.id
              ? h("span", { className: "tag ok" }, `起點：${connectSourceId}`)
              : h("button", { type: "button", className: "primary", onClick: () => { connectNodes(connectSourceId, selectedNode.id); setConnectSourceId(""); } }, `${connectSourceId} -> ${selectedNode.id}`),
          !connectTargetId
            ? h("button", { type: "button", onClick: () => { setConnectTargetId(selectedNode.id); setConnectSourceId(""); } }, "設為箭頭終點")
            : connectTargetId === selectedNode.id
              ? h("span", { className: "tag ok" }, `終點：${connectTargetId}`)
              : h("button", { type: "button", className: "primary", onClick: () => { connectNodes(selectedNode.id, connectTargetId); setConnectTargetId(""); } }, `${selectedNode.id} -> ${connectTargetId}`),
          connectSourceId || connectTargetId ? h("button", { type: "button", onClick: () => { setConnectSourceId(""); setConnectTargetId(""); } }, "取消接線") : null
        ),
        h("p", { className: "hint", style: { marginTop: "10px" } }, "接線有三種：從節點連接點拖到另一個連接點；先設為箭頭起點再點終點；或先設為箭頭終點再點起點。箭頭方向可在箭頭編輯區再改。")
      );
    }

    function LaneSelectField({ value, flowNodes, hiddenLanes = [], customLaneGroups = {}, onChange, onDelete }) {
      const [open, setOpen] = React.useState(false);
      const selectedLane = normalizeLane(value);
      const options = getLaneOptions(flowNodes, selectedLane, hiddenLanes);
      const addLane = () => {
        const groupName = window.prompt("新增泳道分類");
        if (groupName === null || !String(groupName).trim()) return;
        const laneName = window.prompt("新增泳道名稱");
        if (laneName === null || !String(laneName).trim()) return;
        const normalized = normalizeLane(laneName);
        if (normalized && normalized !== noteLaneName) {
          onChange({ lane: normalized, group: String(groupName).trim() });
          setOpen(false);
        }
      };
      return h("div", { className: "field lane-select" },
        h("label", null, "所屬泳道"),
        h("button", {
          type: "button",
          className: "lane-select-button",
          onClick: () => setOpen((current) => !current)
        },
          h("span", null, getLaneOptionLabel(selectedLane, customLaneGroups)),
          h("span", null, open ? "▴" : "▾")
        ),
        open ? h("div", { className: "lane-select-menu" },
          options.map((lane) => h("div", { key: lane, className: "lane-select-row" },
            h("button", {
              type: "button",
              className: `lane-select-choice ${lane === selectedLane ? "active" : ""}`,
              onClick: () => {
                onChange(lane);
                setOpen(false);
              }
            }, getLaneOptionLabel(lane, customLaneGroups)),
            h("button", {
              type: "button",
              className: "lane-delete",
              title: `刪除泳道：${lane}`,
              onClick: (event) => {
                event.stopPropagation();
                onDelete(lane);
                setOpen(false);
              }
            }, "×")
          )),
          h("button", {
            type: "button",
            className: "lane-add",
            onClick: addLane
          }, "＋新增泳道...")
        ) : null
      );
    }

    function renderEdgeEditor(selectedEdge, flowNodes, updateEdge, updateEdgeFields, deleteSelectedEdge) {
      const nodeIds = flowNodes.filter((item) => !isNoteNode(item)).map((item) => item.id);
      const sourceHandle = normalizeHandleId(selectedEdge.sourceHandle, "right-2", "source");
      const targetHandle = normalizeHandleId(selectedEdge.targetHandle, "left-2", "target");
      return h(React.Fragment, null,
        h("p", { className: "hint" }, `箭頭：${selectedEdge.source} -> ${selectedEdge.target}`),
        h("div", { className: "mini-grid" },
          selectField("起點節點", selectedEdge.source, nodeIds, (value) => updateEdgeFields({
            source: value,
            sourceHandle: value === selectedEdge.source ? sourceHandle : "right-2"
          })),
          selectField("終點節點", selectedEdge.target, nodeIds, (value) => updateEdgeFields({
            target: value,
            targetHandle: value === selectedEdge.target ? targetHandle : "left-2"
          }))
        ),
        h("div", { className: "mini-grid" },
          selectField("起點連接處", sourceHandle, sourceHandleOptions, (value) => updateEdgeFields({ sourceHandle: value }), edgeHandleLabels),
          selectField("終點連接處", targetHandle, targetHandleOptions, (value) => updateEdgeFields({ targetHandle: value }), edgeHandleLabels)
        ),
        h("p", { className: "hint" }, "每個節點有 12 個連接點，每邊 3 個；所有線都可改起訖點與連接處。同一連接點只能接一條線，若選到已占用點，系統會自動改用同節點其他可用點。"),
        inputField("箭頭說明", "edgeLabel", selectedEdge.label || "", (value) => updateEdge("label", value)),
        selectField("箭頭樣式", selectedEdge.type || "step", ["step", "smoothstep", "straight", "default"], (value) => updateEdge("type", value)),
        h("div", { className: "toolbar" },
          h("button", {
            type: "button",
            onClick: () => updateEdgeFields({
              source: selectedEdge.target,
              target: selectedEdge.source,
              sourceHandle: normalizeHandleId(targetHandle, "right-2", "source"),
              targetHandle: normalizeHandleId(sourceHandle, "left-2", "target")
            })
          }, "反轉方向"),
          h("button", { type: "button", className: "danger", onClick: deleteSelectedEdge }, "刪除箭頭")
        )
      );
    }

    function inputField(label, id, value, onChange, readOnly = false, placeholder = "", className = "") {
      return h("div", { className: `field ${className}`.trim() },
        h("label", { htmlFor: id }, label),
        h("input", { id, value: value || "", readOnly, placeholder, onChange: (event) => onChange(event.target.value) })
      );
    }

    function numberField(label, value, min, max, onChange) {
      return h("div", { className: "field" },
        h("label", null, label),
        h("input", {
          type: "number",
          min,
          max,
          step: 8,
          value: value || "",
          onChange: (event) => onChange(event.target.value)
        })
      );
    }

    function textField(label, value, onChange) {
      return h("div", { className: "field" },
        h("label", null, label),
        h("textarea", { value: value || "", onChange: (event) => onChange(event.target.value) })
      );
    }

    function selectField(label, value, options, onChange, labels = null) {
      return h("div", { className: "field" },
        h("label", null, label),
        h("select", { value, onChange: (event) => onChange(event.target.value) },
          options.map((option) => h("option", { key: option, value: option }, labels ? labels[option] : option))
        )
      );
    }

    function makeMarkdown(doc, flows) {
      const documentVersion = getDocumentVersion(flows);
      const diagramSections = flows.map((flow) => {
        const flowDoc = getFlowDoc(flow);
        const flowLaneGroups = flowDoc.customLaneGroups || {};
        const processNodes = flow.nodes.filter((item) => !isNoteNode(item));
        const noteNodes = flow.nodes.filter((item) => isNoteNode(item));
        const flowLines = processNodes.map((item, stepIndex) => {
          const outgoing = flow.edges.filter((edgeItem) => edgeItem.source === item.id);
          const edgeText = outgoing.length ? outgoing.map((edgeItem) => `${edgeItem.label || "下一步"} -> ${edgeItem.target}`).join("；") : "無下一步";
          return `${stepIndex + 1}. [${getLaneGroupMap(flowLaneGroups)[item.data.lane] || getLaneGroupName(item.data.lane)} / ${item.data.lane}] ${item.id} ${item.data.title}（${kindLabel[item.data.kind]}）
   - 節點說明：${item.data.desc || "待補"}
   - 流程限制：${item.data.constraint || "無"}
   - 下一步：${edgeText}`;
        }).join("\n");
        const edgeLines = flow.edges.map((item) => `- ${item.source} -> ${item.target}: ${item.label || "下一步"}`).join("\n") || "- 尚未設定";
        const noteLines = noteNodes.map((item) => `- ${item.data.title || item.id}：${item.data.desc || "待補"}`).join("\n") || "- 無";
        return `## ${flowDoc.featureName || flow.name}

- 流程圖名稱：${flow.name}
- 泳道圖版本：${flow.version || "非正式"}

### 流程背景
${flowDoc.background || "待補"}

### 本圖範圍
- 本次包含：${flowDoc.includeScope || "待補"}
- 本次不包含：${flowDoc.excludeScope || "待補"}

### 節點與流程
${flowLines}

### 箭頭連線
${edgeLines}

### 流程備註
${noteLines}`;
      }).join("\n\n");

      return `# ${doc.featureName || "單功能泳道圖"} 彙整

## 泳道圖狀態
- 狀態：${documentVersion}
- 來源：tool-swimlane-diagram
- 下一步：${documentVersion === "正式" ? "可作為流程設計參考" : "完成各泳道圖確認後，將圖版本標為正式"}

## 多流程泳道圖
${diagramSections}

## 流程交接重點
- 本頁是泳道圖彙整，重點是流程圖、節點、連線與備註。
- 泳道採已確認標準：人物與系統兩層，且只顯示該流程用到的泳道。
- 節點可在所屬泳道內自由排列；若要跨泳道，需明確修改節點的所屬泳道。
- 箭頭連線代表流程順序與分支說明，終點節點代表該張流程圖的明確結束。
- 待確認、流程限制與補充說明以各泳道圖備註節點為準。

## 待確認
- 是否採用 React Flow 作為泳道圖編輯器。
- 是否把目前圖形資料儲存成結構化 JSON，作為後續工具資料來源。
`;
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }
    }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    createRoot(document.getElementById("root")).render(h(ReactFlowProvider, null, h(App)));
  </script>
</body>
</html>
