<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Jimmy C">
  <meta name="application-name" content="tool-swimlane-diagram">
  <title>tool-swimlane-diagram</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.11.2/dist/style.css">
  <style>
    :root {
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --line: #d8dee8;
      --line-strong: #aeb8c7;
      --text: #172033;
      --muted: #64748b;
      --blue: #2563eb;
      --green: #047857;
      --amber: #b45309;
      --red: #b91c1c;
      --purple: #6d28d9;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    button.danger {
      border-color: #fecaca;
      color: var(--red);
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--text);
      background: #fff;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
    }

    header {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      background: #0f172a;
      color: #fff;
      border-bottom: 1px solid #111827;
    }

    header h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0;
    }

    header p {
      margin: 2px 0 0;
      color: #cbd5e1;
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .font-size-control {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid #334155;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.42);
    }

    .font-size-control span {
      padding: 0 5px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 800;
    }

    .font-size-control button {
      min-width: 34px;
      padding: 4px 8px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #dbeafe;
      font-size: 13px;
    }

    .font-size-control button.active {
      background: #eff6ff;
      color: var(--blue);
    }

    .mode-control {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid #334155;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.42);
    }

    .mode-control button {
      min-width: 64px;
      padding: 4px 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #dbeafe;
      font-size: 13px;
    }

    .mode-control button.active {
      background: #eff6ff;
      color: var(--blue);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .tag.info { color: var(--blue); border-color: #bfdbfe; background: #eff6ff; }
    .tag.wait { color: var(--amber); border-color: #fde68a; background: #fffbeb; }
    .tag.ok { color: var(--green); border-color: #bbf7d0; background: #f0fdf4; }
    .tag.danger { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
    .tag.formal { color: #065f46; border-color: #86efac; background: #dcfce7; }
    .tag.draft { color: #92400e; border-color: #fde68a; background: #fffbeb; }

    .app {
      display: grid;
      grid-template-columns: minmax(350px, 440px) minmax(860px, 1fr);
      gap: 16px;
      padding: 16px;
      min-height: calc(100vh - 64px);
    }

    .app.collapsed {
      grid-template-columns: 48px minmax(860px, 1fr);
    }

    .side {
      display: grid;
      align-content: start;
      gap: 16px;
      min-width: 0;
    }

    .side-rail {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 96px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .side-rail button {
      writing-mode: vertical-rl;
      min-height: 132px;
      padding: 12px 8px;
      border-color: #bfdbfe;
      color: var(--blue);
      background: #eff6ff;
    }

    .app.collapsed .side-content { display: none; }
    .app.collapsed .side-rail { display: flex; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-width: 0;
      overflow: hidden;
    }

    details.panel > summary {
      list-style: none;
      cursor: pointer;
    }

    details.panel > summary::-webkit-details-marker {
      display: none;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
    }

    details.panel:not([open]) .panel-head {
      border-bottom: 0;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .panel-body {
      padding: 14px 16px 16px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .lane-select {
      position: relative;
    }

    .lane-select-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }

    .lane-select-menu {
      position: absolute;
      z-index: 50;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: 260px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 6px;
    }

    .lane-select-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      gap: 6px;
      align-items: center;
      padding: 3px;
    }

    .lane-select-row button {
      min-height: 34px;
      padding: 6px 8px;
    }

    .lane-select-choice {
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lane-select-choice.active {
      border-color: var(--blue);
      color: var(--blue);
      background: #eff6ff;
    }

    .lane-delete {
      color: var(--red);
      border-color: #fecaca;
    }

    .lane-add {
      width: 100%;
      margin-top: 4px;
      color: var(--blue);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .status-note {
      display: grid;
      gap: 6px;
      margin: -2px 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .flow-area {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      min-width: 0;
    }

    .presentation-app {
      padding: 8px 16px 16px;
      min-height: calc(100vh - 64px);
    }

    .presentation-app .flow-area {
      grid-template-rows: 1fr;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }

    .tabs.dragging {
      cursor: grabbing;
    }

    .tabs::-webkit-scrollbar {
      height: 10px;
    }

    .tabs::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
      border: 2px solid #fff;
    }

    .tabs::-webkit-scrollbar-track {
      background: #f8fafc;
    }

    .tab {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 7px 12px;
      color: var(--muted);
      background: #fff;
      white-space: nowrap;
    }

    .tab.active {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: var(--blue);
    }

    .tab-version {
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .tab-version.formal {
      background: #dcfce7;
      color: #047857;
    }

    .tab-version.draft {
      background: #fffbeb;
      color: #92400e;
    }

    .flow-order-list {
      display: grid;
      gap: 8px;
    }

    .history-actions {
      display: flex;
      gap: 8px;
    }

    .history-actions button {
      flex: 1 1 0;
      padding: 6px 8px;
    }

    .history-list {
      display: grid;
      gap: 4px;
      max-height: 92px;
      overflow: auto;
      padding-right: 2px;
    }

    .history-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .history-item span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flow-search-field {
      margin: 4px 0 8px;
    }

    .flow-order-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .flow-order-item:hover,
    .flow-order-item:focus-visible {
      border-color: #93c5fd;
      background: #eff6ff;
      outline: none;
    }

    .flow-order-item.active {
      border-color: #60a5fa;
      background: #dbeafe;
    }

    .flow-order-name {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 800;
    }

    .flow-order-name .tab-version {
      flex: 0 0 auto;
      margin-left: 0;
    }

    .flow-order-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .flow-order-move {
      width: 32px;
      min-width: 32px;
      height: 32px;
      padding: 0;
      line-height: 1;
    }

    .flow-order-empty {
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .flow-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.42);
    }

    .modal-panel {
      width: min(760px, calc(100vw - 48px));
      max-height: calc(100vh - 72px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.24);
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .modal-body {
      padding: 16px;
    }

    .flow-shell {
      min-height: 720px;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .presentation-mode .flow-shell {
      min-height: calc(100vh - 88px);
      grid-template-rows: auto auto 1fr;
    }

    .flow-canvas {
      position: relative;
      min-height: 640px;
    }

    .presentation-mode .flow-canvas {
      min-height: calc(100vh - 176px);
    }

    .flow-brief {
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .flow-brief summary {
      list-style: none;
      cursor: pointer;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
    }

    .flow-brief summary::-webkit-details-marker {
      display: none;
    }

    .flow-brief summary strong {
      font-size: 15px;
    }

    .flow-brief-body {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 12px;
      padding: 12px 14px 14px;
    }

    .brief-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
    }

    .brief-item b {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    .brief-item p {
      margin: 0;
    }

    .sticky-lane-bar-wrap {
      position: sticky;
      top: 0;
      z-index: 35;
      height: 54px;
      overflow: hidden;
      border-bottom: 1px solid #cbd5e1;
      background: rgba(248, 250, 252, 0.98);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
    }

    .sticky-lane-bar {
      display: grid;
      background: rgba(248, 250, 252, 0.98);
      transform-origin: 0 0;
      pointer-events: none;
    }

    .sticky-lane-cell {
      min-height: 48px;
      padding: 8px 12px;
      border-right: 1px solid #cbd5e1;
      font-weight: 900;
    }

    .sticky-lane-cell small {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .sticky-lane-cell strong {
      display: block;
      font-size: 18px;
    }

    .lane-node {
      height: 100%;
      border-right: 1px solid #cbd5e1;
      background: var(--lane-bg, rgba(255, 255, 255, 0.72));
      pointer-events: none;
    }

    .react-flow__node-laneNode {
      pointer-events: none !important;
    }

    .lane-title {
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(248, 250, 252, 0.98);
      font-weight: 900;
    }

    .lane-title small {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .lane-title strong {
      display: block;
      font-size: 20px;
    }

    .presentation-mode .lane-node .lane-title {
      visibility: hidden;
    }

    .react-flow {
      position: relative;
      z-index: 1;
      background: #f8fafc;
    }

    .react-flow__pane {
      cursor: default;
    }

    .react-flow__edge-path {
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .react-flow__handle {
      width: 11px;
      height: 11px;
      border: 2px solid #fff;
    }

    .ba-node {
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 1px solid var(--line);
      border-left: 5px solid var(--blue);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      padding: 12px;
      color: var(--text);
      box-sizing: border-box;
      overflow: visible;
    }

    .ba-node.selected {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }

    .ba-node.edge-focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 4px rgba(180, 83, 9, 0.24), 0 8px 20px rgba(15, 23, 42, 0.1);
    }

    .ba-node.related-focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.18);
    }

    .ba-node.unlinked {
      border-color: #fca5a5;
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.08);
    }

    .ba-node.start { border-left-color: var(--green); }
    .ba-node.end { border-left-color: #334155; }
    .ba-node.decision { border-left-color: var(--amber); }
    .ba-node.form { border-left-color: var(--purple); }
    .ba-node.exception { border-left-color: var(--red); }
    .ba-node.note {
      border-left-color: var(--amber);
      background: #fffbeb;
    }

    .ba-node.decision {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      padding: 54px 62px;
      text-align: center;
    }

    .ba-node.decision::before,
    .ba-node.decision::after {
      content: "";
      position: absolute;
      pointer-events: none;
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    }

    .ba-node.decision::before {
      inset: 0;
      background: var(--amber);
      filter: drop-shadow(0 6px 18px rgba(15, 23, 42, 0.08));
    }

    .ba-node.decision::after {
      inset: 2px;
      background: #fffbeb;
    }

    .ba-node.decision > :not(.react-flow__handle) {
      position: relative;
      z-index: 1;
    }

    .ba-node.decision .react-flow__handle {
      position: absolute;
      z-index: 2;
    }

    .ba-node.decision.selected::before {
      background: var(--blue);
      filter: drop-shadow(0 0 0 rgba(37, 99, 235, 0.18)) drop-shadow(0 6px 18px rgba(15, 23, 42, 0.08));
    }

    .ba-node.decision.edge-focus::before {
      background: var(--amber);
      filter: drop-shadow(0 0 4px rgba(180, 83, 9, 0.42)) drop-shadow(0 8px 20px rgba(15, 23, 42, 0.1));
    }

    .ba-node.decision.related-focus::before {
      background: var(--green);
    }

    .ba-node.decision.unlinked::before {
      background: var(--red);
    }

    .ba-node.decision .node-meta {
      justify-content: center;
      flex-wrap: wrap;
    }

    .node-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .node-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      margin-right: 6px;
      font-size: 14px;
      color: #fff;
      background: var(--blue);
    }

    .node-symbol.start { background: var(--green); }
    .node-symbol.end { background: #334155; }
    .node-symbol.decision { background: var(--amber); }
    .node-symbol.form { background: var(--purple); }
    .node-symbol.exception { background: var(--red); }
    .node-symbol.note { background: var(--amber); }

    .node-title {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.35;
      font-weight: 900;
    }

    .node-desc {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .node-detail {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid #eef2f7;
      color: #475569;
      font-size: 15px;
      line-height: 1.5;
    }

    .node-warning {
      margin-left: 6px;
      color: var(--red);
      font-size: 13px;
      font-weight: 900;
    }

    .font-small .app,
    .font-small .presentation-app {
      font-size: 15px;
    }

    .font-medium .app,
    .font-medium .presentation-app {
      font-size: 16px;
    }

    .font-small .lane-title {
      padding: 10px 12px;
    }

    .font-small .lane-title small {
      font-size: 13px;
    }

    .font-small .lane-title strong {
      font-size: 18px;
    }

    .font-small .ba-node {
      padding: 10px;
    }

    .font-small .ba-node.decision {
      padding: 48px 56px;
    }

    .font-small .node-meta {
      font-size: 13px;
    }

    .font-small .node-symbol {
      width: 24px;
      height: 24px;
      font-size: 13px;
    }

    .font-small .node-title {
      font-size: 18px;
    }

    .font-small .node-desc,
    .font-small .node-detail {
      font-size: 14px;

      if (value === null || value === undefined) return parts;
      if (typeof value === "string" || typeof value === "number" || typeof value === "boolean") {

      if (Array.isArray(value)) {

      for (let sourceIndex = 0; sourceIndex < source.length && targetIndex < target.length; sourceIndex += 1) {

      return terms.every((term) => fuzzyMatchText(searchText, term));
    }

    function clonePlainValue(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function formatHistoryTime(value) {
      return new Date(value).toLocaleTimeString("zh-TW", {
        hour12: false,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function getDefaultState() {
      return { doc: initialDoc, flows: initialFlows.map(normalizeFlow), activeFlowId: initialFlows[0].id, fontSizeMode: "medium", savedAt: "" };
    }

    function normalizeSavedState(parsed) {
      if (!parsed?.doc || !Array.isArray(parsed?.flows) || parsed.flows.length === 0) {
        return null;
      }
      const parsedFlows = parsed.flows;
      const mergedFlows = parsedFlows
        .concat(initialFlows.filter((initialFlow) => !parsedFlows.some((flow) => flow.id === initialFlow.id)));
      const activeFlowId = parsed.activeFlowId && mergedFlows.some((flow) => flow.id === parsed.activeFlowId)
        ? parsed.activeFlowId
        : mergedFlows[0].id;
      const fontSizeMode = fontSizeModes.includes(parsed.fontSizeMode) ? parsed.fontSizeMode : "medium";
      const savedAt = parsed.savedAt && !Number.isNaN(new Date(parsed.savedAt).getTime()) ? parsed.savedAt : "";
      return { doc: { ...initialDoc, ...parsed.doc }, flows: mergedFlows.map(normalizeFlow), activeFlowId, fontSizeMode, savedAt };
    }

    function savedAtTime(state) {
      const value = state?.savedAt;
      if (!value) return 0;
      const time = new Date(value).getTime();
      return Number.isNaN(time) ? 0 : time;
    }

    function pickNewestState(primaryState, secondaryState) {
      if (!primaryState) return secondaryState || null;
      if (!secondaryState) return primaryState;
      return savedAtTime(primaryState) >= savedAtTime(secondaryState) ? primaryState : secondaryState;
    }

    function loadSavedState() {
      try {
        if (!loadAutoSaveEnabled()) return getDefaultState();
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        return normalizeSavedState(parsed) || getDefaultState();
      } catch {
        return getDefaultState();
      }
    }

    function makeSavePayload(doc, flows, activeFlowId, fontSizeMode) {
      return {
        doc,
        flows: flows.map(sanitizeFlowForSave),
        activeFlowId,
        fontSizeMode,
        savedAt: new Date().toISOString()
      };
    }

    function formatJsonSavedTime(savedAt) {
      if (!savedAt) return "JSON：尚未存檔";
      const date = new Date(savedAt);
      if (Number.isNaN(date.getTime())) return "JSON：尚未存檔";
      return `JSON：${date.toLocaleString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      })}`;
    }

    function loadAutoSaveEnabled() {
      try {
        return window.localStorage.getItem(AUTOSAVE_ENABLED_KEY) !== "false";
      } catch {
        return true;
      }
    }

    function rememberAutoSaveEnabled(enabled) {
      try {
        window.localStorage.setItem(AUTOSAVE_ENABLED_KEY, enabled ? "true" : "false");
      } catch {
        // Ignore private browsing or storage quota failures.
      }
    }

    function saveStatePayload(payload) {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        return true;
      } catch {
        return false;
      }
    }

    function saveState(doc, flows, activeFlowId, fontSizeMode) {
      return saveStatePayload(makeSavePayload(doc, flows, activeFlowId, fontSizeMode));
    }

    function openPersistDb() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }
        const request = window.indexedDB.open(PERSIST_DB_NAME, PERSIST_DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(PERSIST_STORE_NAME)) {
            db.createObjectStore(PERSIST_STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("IndexedDB open failed"));
      });
    }

    async function readPersistentHandle() {
      const db = await openPersistDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PERSIST_STORE_NAME, "readonly");
        const store = tx.objectStore(PERSIST_STORE_NAME);
        const request = store.get(PERSIST_HANDLE_KEY);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error || new Error("Read file handle failed"));
        tx.oncomplete = () => db.close();
        tx.onerror = () => {
          db.close();
          reject(tx.error || new Error("Read file handle transaction failed"));
        };
      });
    }

    async function storePersistentHandle(handle) {
      const db = await openPersistDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PERSIST_STORE_NAME, "readwrite");
        const store = tx.objectStore(PERSIST_STORE_NAME);
        store.put(handle, PERSIST_HANDLE_KEY);
        tx.oncomplete = () => {
          db.close();
          resolve(true);
        };
        tx.onerror = () => {
          db.close();
          reject(tx.error || new Error("Store file handle failed"));
        };
      });
    }

    async function clearPersistentHandle() {
      const db = await openPersistDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(PERSIST_STORE_NAME, "readwrite");
        const store = tx.objectStore(PERSIST_STORE_NAME);
        store.delete(PERSIST_HANDLE_KEY);
        tx.oncomplete = () => {
          db.close();
          resolve(true);
        };
        tx.onerror = () => {
          db.close();
          reject(tx.error || new Error("Clear file handle failed"));
        };
      });
    }

    async function hasFileWritePermission(handle, request = false) {
      if (handle?.kind === "server") return true;
      if (!handle?.queryPermission) return Boolean(handle?.createWritable);
      const options = { mode: "readwrite" };
      if ((await handle.queryPermission(options)) === "granted") return true;
      return request && handle.requestPermission && (await handle.requestPermission(options)) === "granted";
    }

    function supportsAutoPersistentFile() {
      return true;
    }

    async function getServerPersistentTarget() {
      return null;
    }

    async function setServerAutoSavePaused(paused) {
      return Boolean(paused);
    }

    async function getAutoPersistentHandle() {
      const serverTarget = await getServerPersistentTarget().catch(() => null);
      if (serverTarget) return serverTarget;
      if (!navigator.storage?.getDirectory) {
        throw new Error("Auto persistent file is not supported");
      }
      await navigator.storage?.persist?.().catch(() => false);
      const root = await navigator.storage.getDirectory();
      return root.getFileHandle(AUTO_PERSIST_FILE_NAME, { create: true });
    }

    async function writePersistentState(handle, payload) {
      if (handle?.kind === "server") {
        const response = await fetch(handle.api, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (response.status === 423) return { ok: false, paused: true };
        if (!response.ok) throw new Error("Autosave server write failed");
        return { ok: true, paused: false };
      }
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify(payload, null, 2));
      await writable.close();
      return { ok: true, paused: false };
    }

    async function readPersistentState(handle) {
      if (handle?.kind === "server") {
        const response = await fetch(handle.api, { cache: "no-store" });
        if (response.status === 204 || response.status === 404) return null;
        if (!response.ok) throw new Error("Autosave server read failed");
        const text = await response.text();
        if (!text.trim()) return null;
        return normalizeSavedState(JSON.parse(text));
      }
      const file = await handle.getFile();
      const text = await file.text();
      if (!text.trim()) return null;
      const parsed = JSON.parse(text);
      return normalizeSavedState(parsed);
    }

    function node(id, lane, kind, x, y, title, desc, constraint = "", size = {}) {
      const width = size.width || defaultNodeWidth;
      return {
        id,
        type: "baNode",
        position: { x, y },
        origin: [0, 0],
        data: {
          lane: normalizeLane(lane),
          kind,
          title,
          desc,
          constraint,
          width,
          height: size.height || estimateNodeHeight({ title, desc, constraint, width })
        }
      };
    }

    function noteNode(id, y, title, desc) {
      return {
        id,
        type: "baNode",
        position: { x: 0, y },
        origin: [0, 0],
        data: { lane: noteLaneName, kind: "note", title, desc, constraint: "", width: noteNodeWidth, height: estimateNoteHeight({ title, desc }) }
      };
    }

    function normalizeLane(value) {
      if (value === noteLaneName) return noteLaneName;
      const mapped = legacyLaneMap[value] || value;
      const normalized = String(mapped || "").trim();
      return normalized || "申請人";
    }

    function getLaneGroupName(lane) {
      if (lane === noteLaneName) return "備註";
      return laneGroupByName[lane] || "自訂";
    }

    function getLaneGroupMap(customLaneGroups = {}) {
      return {
        ...laneGroupByName,
        ...(customLaneGroups || {})
      };
    }

    function getLaneOptionLabel(lane, customLaneGroups = {}) {
      return `${getLaneGroupMap(customLaneGroups)[lane] || getLaneGroupName(lane)} / ${lane}`;
    }

    function getLaneOptions(nodes = [], selectedLane = "", hiddenLanes = []) {
      const hidden = new Set(hiddenLanes.map(normalizeLane));
      const options = laneOptions.filter((lane) => !hidden.has(lane));
      [selectedLane]
        .concat(nodes.filter((item) => !isNoteNode(item)).map((item) => normalizeLane(item.data?.lane)))
        .filter((lane) => lane && lane !== noteLaneName)
        .forEach((lane) => {
          if (!hidden.has(lane) && !options.includes(lane)) options.push(lane);
        });
      return options;
    }

    function isNoteNode(node) {
      return normalizeLane(node?.data?.lane) === noteLaneName || node?.data?.kind === "note";
    }

    function normalizeFlow(flow) {
      const nodes = Array.isArray(flow.nodes) ? flow.nodes.map(normalizeSavedNode) : [];
      const nodesWithNotes = nodes.some((item) => isNoteNode(item))
        ? nodes
        : nodes.concat(noteNode(`RM-${String(flow.id || "flow").replace(/[^a-zA-Z0-9]/g, "")}`, 88, "流程備註", "可在此補充本流程的例外、待確認或閱讀提示。"));
      return {
        ...flow,
        version: flowVersions.includes(flow.version) ? flow.version : "非正式",
        doc: normalizeFlowDoc(flow),
        nodes: clampFlowNodes(nodesWithNotes),
        edges: Array.isArray(flow.edges) ? normalizeFlowEdges(flow.edges.map(normalizeSavedEdge)) : []
      };
    }

    function handlePointFromId(handleId) {
      const value = String(handleId || "");
      if (legacyHandlePointMap[value]) return legacyHandlePointMap[value];
      if (value.startsWith("source-")) return value.slice("source-".length);
      if (value.startsWith("target-")) return value.slice("target-".length);
      if (value.startsWith("handle-")) return value.slice("handle-".length);
      return connectionPointIds.includes(value) ? value : "";
    }

    function normalizeHandleId(handleId, fallback = "right-2", role = "source") {
      if (connectionPointIds.includes(handleId)) return handleId;
      const pointId = handlePointFromId(handleId);
      if (connectionPointIds.includes(pointId)) return pointId;
      return fallback;
    }

    function normalizeSavedEdge(savedEdge) {
      const { selected, ...persistedEdge } = savedEdge || {};
      const edgeType = savedEdge?.type === "straight" ? "straight" : "cleanStep";
      return {
        ...persistedEdge,
        sourceHandle: normalizeHandleId(savedEdge?.sourceHandle, "right-2", "source"),
        targetHandle: normalizeHandleId(savedEdge?.targetHandle, "left-2", "target"),
        type: edgeType,
        pathOptions: edgeType === "cleanStep" ? {} : savedEdge?.pathOptions
      };
    }

    function normalizeFlowEdges(edges) {
      return assignUniqueConnectionHandles(edges.map((item) => ({
          ...item,
          sourceHandle: normalizeHandleId(item.sourceHandle, "right-2", "source"),
          targetHandle: normalizeHandleId(item.targetHandle, "left-2", "target")
      })));
    }

    function normalizeSavedNode(savedNode) {
      const { selected, dragging, resizing, ...persistedNode } = savedNode || {};
      const data = savedNode?.data || {};
      const width = data.kind === "note" || data.lane === noteLaneName
        ? noteNodeWidth
        : normalizeSavedNodeWidth(data.width);
      const baseData = {
        lane: normalizeLane(data.lane || data.actor),
        kind: data.kind === "note" || data.lane === noteLaneName ? "note" : data.kind || "task",
        title: data.title || "未命名節點",
        desc: data.desc || "",
        constraint: data.constraint || data.rule || "",
        width
      };
      return {
        ...persistedNode,
        type: "baNode",
        origin: [0, 0],
        position: savedNode?.position || { x: lanePadding, y: 88 },
        data: {
          ...baseData,
          height: baseData.kind === "note"
            ? clamp(Number(data.height) || defaultNoteHeight, minNoteHeight, canvasHeight - 120)
            : normalizeSavedNodeHeight(data.height)
        }
      };
    }

    function edge(source, target, label, options = {}) {
      return {
        id: `e-${source}-${target}-${Math.random().toString(36).slice(2, 7)}`,
        source,
        target,
        sourceHandle: normalizeHandleId(options.sourceHandle, "right-2", "source"),
        targetHandle: normalizeHandleId(options.targetHandle, "left-2", "target"),
        label,
        type: options.type || "cleanStep",
        animated: false,
        markerEnd: { type: "arrowclosed" },
        style: { strokeWidth: 2.6, stroke: "#1d4ed8" },
        labelStyle: { fontSize: 18, fontWeight: 900, fill: "#0f172a" },
        interactionWidth: 32,
        pathOptions: options.type === "straight" ? undefined : {},
        labelBgPadding: [18, 10],
        labelBgBorderRadius: 8,
        labelBgStyle: { fill: "#fff", stroke: "#cbd5e1" }
      };
    }

    function isSourceHandleUsed(edges, nodeId, handleId, ignoreEdgeId = "") {
      if (!nodeId || !handleId) return false;
      return edges.some((item) => item.id !== ignoreEdgeId && item.source === nodeId && normalizeHandleId(item.sourceHandle, "right-2", "source") === handleId);
    }

    function isTargetHandleUsed(edges, nodeId, handleId, ignoreEdgeId = "") {
      if (!nodeId || !handleId) return false;
      return edges.some((item) => item.id !== ignoreEdgeId && item.target === nodeId && normalizeHandleId(item.targetHandle, "left-2", "target") === handleId);
    }

    function isHandleUsedOnNode(edges, nodeId, handleId, ignoreEdgeId = "") {
      if (!nodeId || !handleId) return false;
      return edges.some((item) => {
        if (item.id === ignoreEdgeId) return false;
        const sourceHandle = normalizeHandleId(item.sourceHandle, "right-2", "source");
        const targetHandle = normalizeHandleId(item.targetHandle, "left-2", "target");
        return (item.source === nodeId && sourceHandle === handleId) ||
          (item.target === nodeId && targetHandle === handleId);
      });
    }

    function canUseConnection(connection, edges, ignoreEdgeId = "") {
      return Boolean(resolveConnectionHandles(connection, edges, ignoreEdgeId));
    }

    function firstFreeHandle(edges, nodeId, preferred = [], role = "source", ignoreEdgeId = "") {
      const options = role === "target" ? targetHandleOptions : sourceHandleOptions;
      const candidates = [...new Set(preferred.concat(options))];
      return candidates.find((handleId) => !isHandleUsedOnNode(edges, nodeId, handleId, ignoreEdgeId)) || "";
    }

    function resolveConnectionHandles(connection, edges, ignoreEdgeId = "") {
      if (!connection?.source || !connection?.target || connection.source === connection.target) return null;
      if (!connection.sourceHandle || !connection.targetHandle) return null;
      const preferredSource = normalizeHandleId(connection.sourceHandle, "right-2", "source");
      const preferredTarget = normalizeHandleId(connection.targetHandle, "left-2", "target");
      const sourceHandle = isHandleUsedOnNode(edges, connection.source, preferredSource, ignoreEdgeId)
        ? firstFreeHandle(edges, connection.source, [preferredSource, "right-2", "bottom-2", "left-2", "top-2"], "source", ignoreEdgeId)
        : preferredSource;
      const targetHandle = isHandleUsedOnNode(edges, connection.target, preferredTarget, ignoreEdgeId)
        ? firstFreeHandle(edges, connection.target, [preferredTarget, "left-2", "top-2", "right-2", "bottom-2"], "target", ignoreEdgeId)
        : preferredTarget;
      if (!sourceHandle || !targetHandle) return null;
      return { ...connection, sourceHandle, targetHandle };
    }

    function assignUniqueConnectionHandles(edges) {
      const normalized = [];
      edges.forEach((item) => {
        const preferredSource = normalizeHandleId(item.sourceHandle, "right-2", "source");
        const preferredTarget = normalizeHandleId(item.targetHandle, "left-2", "target");
        const sourceHandle = isHandleUsedOnNode(normalized, item.source, preferredSource)
          ? firstFreeHandle(normalized, item.source, [preferredSource, "right-2", "bottom-2", "left-2", "top-2"], "source")
          : preferredSource;
        const targetHandle = isHandleUsedOnNode(normalized, item.target, preferredTarget)
          ? firstFreeHandle(normalized, item.target, [preferredTarget, "left-2", "top-2", "right-2", "bottom-2"], "target")
          : preferredTarget;
        normalized.push({ ...item, sourceHandle: sourceHandle || preferredSource, targetHandle: targetHandle || preferredTarget });
      });
      return normalized;
    }

    function getPointerClientPosition(event) {
      const touch = event?.changedTouches?.[0] || event?.touches?.[0];
      const clientX = Number.isFinite(event?.clientX) ? event.clientX : touch?.clientX;
      const clientY = Number.isFinite(event?.clientY) ? event.clientY : touch?.clientY;
      if (!Number.isFinite(clientX) || !Number.isFinite(clientY)) return null;
      return { clientX, clientY };
    }

    function nearestNodeHandleAtPoint(nodeId, clientX, clientY, radius = 48) {
      if (!nodeId) return null;
      const nodeSelector = `.react-flow__node[data-id="${CSS.escape(nodeId)}"]`;
      const handles = [...document.querySelectorAll(`${nodeSelector} .react-flow__handle.handle-dual`)];
      let best = null;
      handles.forEach((handle) => {
        const rect = handle.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const distance = Math.hypot(cx - clientX, cy - clientY);
        if (distance <= radius && (!best || distance < best.distance)) {
          best = {
            handleId: normalizeHandleId(handle.getAttribute("data-handleid") || handle.id, "right-2"),
            distance
          };
        }
      });
      return best;
    }

    function getWarnings(node, edges) {
      if (isNoteNode(node)) return [];
      const incoming = edges.some((item) => item.target === node.id);
      const outgoing = edges.some((item) => item.source === node.id);
      const warnings = [];
      if (node.data.kind !== "start" && !incoming) warnings.push("缺前");
      if (node.data.kind !== "end" && !outgoing) warnings.push("缺後");
      return warnings;
    }

    function getVisibleLaneGroups(nodes, hiddenLanes = [], customLaneGroups = {}) {
      const hidden = new Set(hiddenLanes.map(normalizeLane));
      const groupMap = getLaneGroupMap(customLaneGroups);
      const used = new Set(nodes.filter((item) => !isNoteNode(item)).map((item) => normalizeLane(item.data?.lane)).filter(Boolean));
      if (used.size === 0) used.add("申請人");
      const knownGroups = laneGroups
        .map((group) => ({ ...group, lanes: group.lanes.filter((lane) => used.has(lane) && !hidden.has(lane)) }))
        .filter((group) => group.lanes.length > 0);
      const customByGroup = [...used]
        .filter((lane) => lane !== noteLaneName && !hidden.has(lane) && !laneOptions.includes(lane))
        .reduce((groups, lane) => {
          const groupName = groupMap[lane] || "自訂";
          if (!groups[groupName]) groups[groupName] = [];
          groups[groupName].push(lane);
          return groups;
        }, {});
      return knownGroups.concat(Object.entries(customByGroup).map(([group, lanes]) => ({ group, lanes })));
    }

    function getVisibleLanes(nodes, hiddenLanes = [], customLaneGroups = {}) {
      return getVisibleLaneGroups(nodes, hiddenLanes, customLaneGroups).flatMap((group) => group.lanes);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function normalizeSavedNodeWidth(value) {
      const width = Number(value);
      if (!width || Math.abs(width - legacyDefaultNodeWidth) <= 1) return defaultNodeWidth;
      return clamp(width, minNodeWidth, maxNodeWidth);
    }

    function estimateTextLines(text, charsPerLine) {
      const value = String(text || "").trim();
      if (!value) return 0;
      return value.split(/\n+/).reduce((total, line) => {
        const normalizedLength = Array.from(line.trim()).reduce((sum, char) => {
          return sum + (/[\x00-\x7F]/.test(char) ? 0.55 : 1);
        }, 0);
        return total + Math.max(1, Math.ceil(normalizedLength / charsPerLine));
      }, 0);
    }

    function estimateNodeHeight(data = {}) {
      const width = clamp(Number(data.width) || defaultNodeWidth, minNodeWidth, maxNodeWidth);
      const charsPerLine = Math.max(8, Math.floor((width - 24) / 17));
      const titleLines = estimateTextLines(data.title, charsPerLine);
      const descLines = estimateTextLines(data.desc, charsPerLine);
      const constraintLines = estimateTextLines(data.constraint, Math.max(8, charsPerLine - 2));
      const metaHeight = 30;
      const titleHeight = Math.max(28, titleLines * 27);
      const descHeight = descLines * 24;
      const detailHeight = constraintLines ? 14 + constraintLines * 23 : 0;
      const paddingAndGap = 72;
      const contentHeight = Math.ceil(metaHeight + titleHeight + descHeight + detailHeight + paddingAndGap);
      return clamp(contentHeight, minNodeHeight, maxNodeHeight);
    }

    function estimateNoteHeight(data = {}) {
      const charsPerLine = Math.max(8, Math.floor((noteNodeWidth - 24) / 16));
      const titleLines = estimateTextLines(data.title, charsPerLine);
      const descLines = estimateTextLines(data.desc, charsPerLine);
      const metaHeight = 30;
      const titleHeight = Math.max(26, titleLines * 25);
      const descHeight = descLines * 23;
      const paddingAndGap = 54;
      return clamp(Math.ceil(metaHeight + titleHeight + descHeight + paddingAndGap), minNoteHeight, canvasHeight - 120);
    }

    function normalizeSavedNodeHeight(value) {
      const height = Number(value);
      if (!height || Math.abs(height - legacyDefaultNodeHeight) <= 1) return defaultNodeHeight;
      return clamp(height, minNodeHeight, maxNodeHeight);
    }

    function nodeWidthOf(node) {
      if (isNoteNode(node)) return noteNodeWidth;
      return clamp(Number(node.data?.width) || defaultNodeWidth, minNodeWidth, maxNodeWidth);
    }

    function nodeHeightOf(node) {
      if (isNoteNode(node)) return clamp(Number(node.data?.height) || defaultNoteHeight, minNoteHeight, canvasHeight - 120);
      return clamp(Number(node.data?.height) || defaultNodeHeight, minNodeHeight, maxNodeHeight);
    }

    function laneIndexForNode(node, visibleLanes) {
      const lane = normalizeLane(node.data?.lane);
      return Math.max(0, visibleLanes.indexOf(lane));
    }

    function centeredXForNode(node, visibleLanes) {
      if (isNoteNode(node)) return visibleLanes.length * laneWidth + Math.round((noteLaneWidth - noteNodeWidth) / 2);
      const index = laneIndexForNode(node, visibleLanes);
      return index * laneWidth + Math.round((laneWidth - nodeWidthOf(node)) / 2);
    }

    function clampNodeToLane(node, visibleLanes) {
      const height = nodeHeightOf(node);
      if (isNoteNode(node)) {
        return {
          ...node,
          position: {
            x: centeredXForNode(node, visibleLanes),
            y: clamp(node.position?.y || 72, 72, canvasHeight - height - 80)
          },
          data: {
            ...node.data,
            lane: noteLaneName,
            kind: "note",
            width: noteNodeWidth,
            height
          }
        };
      }
      return {
        ...node,
        position: {
          x: centeredXForNode(node, visibleLanes),
          y: clamp(node.position?.y || 72, 72, canvasHeight - height - 80)
        },
        data: {
          ...node.data,
          width: nodeWidthOf(node),
          height
        }
      };
    }

    function clampFlowNodes(nodes) {
      const visibleLanes = getVisibleLanes(nodes);
      const prepared = nodes.map((item) => clampNodeToLane(item, visibleLanes));
      const byId = new Map(prepared.map((item) => [item.id, item]));
      visibleLanes.forEach((lane) => {
        let cursor = 72;
        prepared
          .filter((item) => normalizeLane(item.data?.lane) === lane)
          .sort((a, b) => (a.position?.y || 0) - (b.position?.y || 0))
          .forEach((item) => {
            const height = nodeHeightOf(item);
            const y = Math.max(item.position.y, cursor);
            byId.set(item.id, {
              ...item,
              position: { ...item.position, y },
              data: { ...item.data, height }
            });
            cursor = y + height + nodeGap;
          });
      });
      return nodes.map((item) => byId.get(item.id) || item);
    }

    function stripTransientNodeState(node) {
      const { selected, dragging, resizing, ...persistedNode } = node;

    function stripTransientEdgeState(edge) {

      return clampFlowNodes(nodes).map(stripTransientNodeState);

    function prepareEdgesForSave(edges) {

    function handleFaceFromPosition(position) {
      if (position === Position.Top) return "top";
      if (position === Position.Right) return "right";
      if (position === Position.Bottom) return "bottom";
      if (position === Position.Left) return "left";
      return "";
    }

    function handleFaceFromId(handleId, position) {
      const face = String(handleId || "").split("-")[0];
      return ["top", "right", "bottom", "left"].includes(face) ? face : handleFaceFromPosition(position);
    }

    function isHorizontalFace(face) {
      return face === "left" || face === "right";
    }

    function facePointsToward(face, from, to) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      if (face === "right") return dx > 0 && Math.abs(dy) < 1;
      if (face === "left") return dx < 0 && Math.abs(dy) < 1;
      if (face === "bottom") return dy > 0 && Math.abs(dx) < 1;
      if (face === "top") return dy < 0 && Math.abs(dx) < 1;
      return false;
    }

    function sameFaceRoute(source, target, face) {
      const gap = 64;
      if (face === "right") {
        const x = Math.max(source.x, target.x) + gap;
        return [source, { x, y: source.y }, { x, y: target.y }, target];
      }
      if (face === "left") {
        const x = Math.min(source.x, target.x) - gap;
        return [source, { x, y: source.y }, { x, y: target.y }, target];
      }
      if (face === "bottom") {
        const y = Math.max(source.y, target.y) + gap;
        return [source, { x: source.x, y }, { x: target.x, y }, target];
      }
      const y = Math.min(source.y, target.y) - gap;
      return [source, { x: source.x, y }, { x: target.x, y }, target];
    }

    function CleanStepEdge({ id, sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, sourceHandleId, targetHandleId, markerEnd, style, label, labelStyle }) {
      const sameX = Math.abs(sourceX - targetX) < 1;
      const sameY = Math.abs(sourceY - targetY) < 1;
      const sourceFace = handleFaceFromId(sourceHandleId, sourcePosition);
      const targetFace = handleFaceFromId(targetHandleId, targetPosition);
      const horizontalSource = isHorizontalFace(sourceFace);
      const horizontalTarget = isHorizontalFace(targetFace);
      const source = { x: sourceX, y: sourceY };
      const target = { x: targetX, y: targetY };
      let points;

      if ((sameX || sameY) && facePointsToward(sourceFace, source, target) && facePointsToward(targetFace, target, source)) {
        points = [source, target];
      } else if (sourceFace && sourceFace === targetFace) {
        points = sameFaceRoute(source, target, sourceFace);
      } else if (horizontalSource && !horizontalTarget) {
        points = [source, { x: targetX, y: sourceY }, target];
      } else if (!horizontalSource && horizontalTarget) {
        points = [source, { x: sourceX, y: targetY }, target];
      } else if (horizontalSource && horizontalTarget) {
        const midX = (sourceX + targetX) / 2;
        points = [source, { x: midX, y: sourceY }, { x: midX, y: targetY }, target];
      } else {
        const midY = (sourceY + targetY) / 2;
        points = [source, { x: sourceX, y: midY }, { x: targetX, y: midY }, target];
      }

      points = points.reduce((items, point) => {
        const prev = items[items.length - 1];
        if (prev && Math.abs(prev.x - point.x) < 1 && Math.abs(prev.y - point.y) < 1) return items;
        if (items.length >= 2) {
          const beforePrev = items[items.length - 2];
          const sameVertical = Math.abs(beforePrev.x - prev.x) < 1 && Math.abs(prev.x - point.x) < 1;
          const sameHorizontal = Math.abs(beforePrev.y - prev.y) < 1 && Math.abs(prev.y - point.y) < 1;
          const sameVerticalDirection = Math.sign(prev.y - beforePrev.y) === Math.sign(point.y - prev.y);
          const sameHorizontalDirection = Math.sign(prev.x - beforePrev.x) === Math.sign(point.x - prev.x);
          if ((sameVertical && sameVerticalDirection) || (sameHorizontal && sameHorizontalDirection)) items.pop();
        }
        items.push(point);
        return items;
      }, []);

      const path = points.map((point, index) => `${index === 0 ? "M" : "L"} ${point.x},${point.y}`).join(" ");
      const totalLength = points.slice(1).reduce((sum, point, index) => sum + Math.hypot(point.x - points[index].x, point.y - points[index].y), 0);
      let remaining = totalLength / 2;
      let labelX = (sourceX + targetX) / 2;
      let labelY = (sourceY + targetY) / 2;
      for (let index = 1; index < points.length; index += 1) {
        const from = points[index - 1];
        const to = points[index];
        const segmentLength = Math.hypot(to.x - from.x, to.y - from.y);
        if (remaining <= segmentLength || index === points.length - 1) {
          const ratio = segmentLength ? remaining / segmentLength : 0;
          labelX = from.x + (to.x - from.x) * ratio;
          labelY = from.y + (to.y - from.y) * ratio;
          break;
        }
        remaining -= segmentLength;
      }
      return h("g", null,
        h("path", {
          d: path,
          fill: "none",
          stroke: "transparent",
          strokeWidth: 32,
          className: "react-flow__edge-interaction"
        }),
        h("path", {
          id,
          d: path,
          fill: "none",
          markerEnd,
          className: "react-flow__edge-path",
          style
        }),
        label ? h("text", {
          x: labelX,
          y: labelY - 8,
          textAnchor: "middle",
          dominantBaseline: "central",
          style: {
            paintOrder: "stroke",
            stroke: "#fff",
            strokeWidth: 8,
            strokeLinecap: "round",
            strokeLinejoin: "round",
            ...(labelStyle || {})
          }
        }, label) : null
      );
    }

    function renderFlowBrief(doc, activeFlow, visibleLaneGroups) {

      }, [doc, flows, activeFlowId, fontSizeMode, nodes, edges]);

      const restoreHistorySnapshot = useCallback((snapshot) => {
        if (!snapshot?.flows?.length) return;
        const restored = clonePlainValue(snapshot);
        const nextActiveFlowId = restored.flows.some((flow) => flow.id === restored.activeFlowId)

      const pushHistoryLog = (items, label, at, coalesceKey) => {
        const first = items[0];
        if (first?.coalesceKey === coalesceKey) {
          return [{ ...first, label, at }, ...items.slice(1)];
        }
        return [{ id: `log-${at}-${Math.random()}`, label, at, coalesceKey }, ...items].slice(0, HISTORY_LIMIT);
      };

      const recordHistory = useCallback((label, coalesceKey = label, snapshotOverride = null) => {
        const snapshot = snapshotOverride || makeHistorySnapshot();
        const at = Date.now();
        setHistoryState((current) => {
          const first = current.undo[0];
          const shouldCoalesce = first?.coalesceKey === coalesceKey && at - first.at < 1200;
          const entry = shouldCoalesce
            ? { ...first, label, at }
            : { id: `undo-${at}-${Math.random()}`, label, at, coalesceKey, snapshot };
          return {
            undo: shouldCoalesce ? [entry, ...current.undo.slice(1)] : [entry, ...current.undo].slice(0, HISTORY_LIMIT),
            redo: [],
            log: pushHistoryLog(current.log, label, at, coalesceKey)
          };
        });
      }, [makeHistorySnapshot]);

      const undoHistory = useCallback(() => {
        const entry = historyState.undo[0];
        if (!entry) {
          setSaveStatus("沒有可復原的操作");
          return;
        }
        const currentSnapshot = makeHistorySnapshot();
        const at = Date.now();
        setHistoryState((current) => ({
          undo: current.undo.slice(1),
          redo: [{ ...entry, id: `redo-${at}-${Math.random()}`, at, snapshot: currentSnapshot }, ...current.redo].slice(0, HISTORY_LIMIT),
          log: pushHistoryLog(current.log, `復原：${entry.label}`, at, `undo-${at}`)
        }));
        restoreHistorySnapshot(entry.snapshot);
        setSaveStatus(`已復原：${entry.label}`);
      }, [historyState.undo, makeHistorySnapshot, restoreHistorySnapshot]);

      const redoHistory = useCallback(() => {
        const entry = historyState.redo[0];
        if (!entry) {
          setSaveStatus("沒有可取消復原的操作");
          return;

        const currentSnapshot = makeHistorySnapshot();
        const at = Date.now();
        setHistoryState((current) => ({
          undo: [{ ...entry, id: `undo-${at}-${Math.random()}`, at, snapshot: currentSnapshot }, ...current.undo].slice(0, HISTORY_LIMIT),
          redo: current.redo.slice(1),
          log: pushHistoryLog(current.log, `取消復原：${entry.label}`, at, `redo-${at}`)
        }));
        restoreHistorySnapshot(entry.snapshot);
        setSaveStatus(`已取消復原：${entry.label}`);
      }, [historyState.redo, makeHistorySnapshot, restoreHistorySnapshot]);

      const flushAutosave = useCallback(async (updateStatus = true, force = false) => {
        if (!autoSaveEnabled) {
          if (updateStatus) setSaveStatus("自動存檔已關閉，未寫入 JSON");
          return true;
        }
        if (autosaveInFlightRef.current) return false;
        if (!dirtySaveRef.current && !force) return true;
        autosaveInFlightRef.current = true;
        const latest = latestSaveRef.current;
        const payload = makeSavePayload(latest.doc, latest.flows, latest.activeFlowId, latest.fontSizeMode);
        const localOk = saveStatePayload(payload);
        dirtySaveRef.current = false;
        let fileOk = true;
        let wrotePersistentFile = false;
        const handle = persistentHandleRef.current;
        if (handle && persistentReadyRef.current) {
          try {
            const writeResult = await writePersistentState(handle, payload);
            if (writeResult?.paused) {
              fileOk = false;
              dirtySaveRef.current = true;
              setAutoSaveEnabled(false);
              rememberAutoSaveEnabled(false);
              setPersistentStatus(`自動儲存 JSON 已暫停：${handle.name}`);
            } else {
              wrotePersistentFile = true;
              setLastJsonSavedAt(payload.savedAt);
              setPersistentStatus(`自動儲存 JSON 已寫入：${handle.name}`);
            }
          } catch {
            fileOk = false;
            dirtySaveRef.current = true;
            persistentReadyRef.current = false;
            setPersistentStatus(`自動儲存 JSON 寫入失敗：${handle.name}`);
          }
        }
        autosaveInFlightRef.current = false;
        if (updateStatus) {
          const time = new Date().toLocaleTimeString("zh-TW", { hour12: false });
          if (localOk && fileOk && wrotePersistentFile) {
            setSaveStatus(`已自動寫入 JSON ${time}`);
          } else if (localOk && fileOk) {
            setSaveStatus(`已存瀏覽器暫存 ${time}，尚未建立自動儲存 JSON`);
          } else if (!fileOk && !autoSaveEnabled) {
            setSaveStatus("自動存檔已關閉，未寫入 JSON");
          } else if (!fileOk) {
            setSaveStatus("自動儲存 JSON 已暫停或寫入失敗，已保留待重試");
          } else {
            setSaveStatus("瀏覽器暫存失敗");

        }
        return localOk && fileOk;
      }, [autoSaveEnabled]);

        const handle = await getAutoPersistentHandle();

          setAutoSaveEnabled(false);
          rememberAutoSaveEnabled(false);
          setPersistentStatus(`自動儲存 JSON 已暫停：${handle.name}`);
        } else {
          setAutoSaveEnabled(true);
          rememberAutoSaveEnabled(true);
        }
        const fileState = await readPersistentState(handle).catch(() => null);
        const newestState = pickNewestState(initialState, fileState);
        if (newestState) {
          const fileFlow = newestState.flows.find((flow) => flow.id === newestState.activeFlowId) || newestState.flows[0];
          skipNextDirtyRef.current = true;
          setDoc(newestState.doc);
          setFlows(newestState.flows);
          setActiveFlowId(newestState.activeFlowId);
          setNodes(fileFlow.nodes);
          setEdges(fileFlow.edges);
          setSelectedNodeId(fileFlow.nodes[0]?.id || "");
          setSelectedEdgeId("");
          setFontSizeMode(newestState.fontSizeMode);
          setHistoryState({ undo: [], redo: [], log: [] });
          latestSaveRef.current = newestState;
          const payload = makeSavePayload(newestState.doc, newestState.flows, newestState.activeFlowId, newestState.fontSizeMode);
          const writeResult = await writePersistentState(handle, payload);
          if (!writeResult?.paused) saveStatePayload(payload);
          setLastJsonSavedAt(writeResult?.paused ? newestState.savedAt || "" : payload.savedAt);
          dirtySaveRef.current = Boolean(writeResult?.paused);
          const sourceText = fileState && newestState === initialState && savedAtTime(initialState) > savedAtTime(fileState)
            ? "瀏覽器暫存較新，已同步回 JSON"
            : "已載入並同步";
          setPersistentStatus(writeResult?.paused ? `${statusPrefix} 已載入，寫入暫停：${handle.name}` : `${statusPrefix} ${sourceText}：${handle.name}`);
          setSaveStatus(writeResult?.paused ? `已載入自動儲存 JSON，但自動存檔關閉：${handle.name}` : `已載入自動儲存 JSON：${handle.name}`);
          return handle;
        }
        const latest = latestSaveRef.current;
        const payload = makeSavePayload(latest.doc, latest.flows, latest.activeFlowId, latest.fontSizeMode);
        const writeResult = await writePersistentState(handle, payload);
        if (!writeResult?.paused) saveStatePayload(payload);
        setLastJsonSavedAt(writeResult?.paused ? "" : payload.savedAt);
        dirtySaveRef.current = false;
        setPersistentStatus(writeResult?.paused ? `${statusPrefix} 已建立，寫入暫停：${handle.name}` : `${statusPrefix} 已建立並寫入：${handle.name}`);
        setSaveStatus(writeResult?.paused ? `已建立自動儲存 JSON，但自動存檔關閉：${handle.name}` : `已自動建立 JSON 檔並存檔：${handle.name}`);
        return handle;
